<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>regression calculator</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf8f5;
  --bg-surface: #ffffff;
  --bg-inset: #f3f0ec;
  --bg-hover: #edeae5;
  --border: #ddd8d0;
  --border-strong: #c5bfb5;
  --text: #1a1815;
  --text-secondary: #5c574e;
  --text-muted: #9a9489;
  --accent: #b44a2d;
  --accent-light: rgba(180, 74, 45, 0.08);
  --accent-border: rgba(180, 74, 45, 0.25);
  --ink: #2c2824;
  --success: #2d7a4f;
  --success-bg: rgba(45, 122, 79, 0.06);
  --success-border: rgba(45, 122, 79, 0.2);
  --fail: #a83232;
  --fail-bg: rgba(168, 50, 50, 0.06);
  --fail-border: rgba(168, 50, 50, 0.2);
  --warn-bg: rgba(180, 140, 40, 0.06);
  --warn-border: rgba(180, 140, 40, 0.25);
  --warn: #8a6d1e;
  --radius: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
  --blue: #2d5fa8;
  --blue-bg: rgba(45, 95, 168, 0.06);
  --blue-border: rgba(45, 95, 168, 0.2);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(180,160,140,0.04) 27px, rgba(180,160,140,0.04) 28px);
  pointer-events: none;
  z-index: 0;
}

.app { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 40px 28px 80px; }

.header { margin-bottom: 40px; padding-bottom: 24px; border-bottom: 2px solid var(--border); }
.header h1 { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 700; color: var(--ink); letter-spacing: -0.5px; }
.header .subtitle { font-size: 14px; color: var(--text-muted); margin-top: 6px; }

.section {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text-muted);
  margin-bottom: 18px;
}

/* Toolbar */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin-bottom: 16px;
  padding: 8px;
  background: var(--bg-inset);
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.toolbar-group {
  display: flex;
  gap: 2px;
  padding-right: 8px;
  margin-right: 5px;
  border-right: 1px solid var(--border);
}
.toolbar-group:last-child { border-right: none; margin-right: 0; padding-right: 0; }

.tb-btn {
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 5px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 13px;
  font-family: 'Outfit', sans-serif;
  font-weight: 500;
  transition: all 0.1s;
  position: relative;
  padding: 0 12px;
  white-space: nowrap;
}
.tb-btn:hover { background: var(--bg-hover); border-color: var(--border); color: var(--ink); }
.tb-btn:active { transform: scale(0.94); }
.tb-btn.active { background: var(--accent-light); border-color: var(--accent-border); color: var(--accent); }
.tb-btn[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 4px;
  white-space: nowrap;
  z-index: 100;
  pointer-events: none;
}

/* Data input */
.data-input-area {
  width: 100%;
  min-height: 160px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 22px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  line-height: 1.8;
  color: var(--ink);
  background: var(--bg-surface);
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.04);
  resize: vertical;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.data-input-area:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light), inset 0 1px 3px rgba(0,0,0,0.04);
}
.data-input-area::placeholder { color: var(--text-muted); font-family: 'Outfit', sans-serif; font-size: 13px; }

/* Equation cards (sample datasets) */
.eq-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.eq-card {
  display: flex; flex-direction: column; gap: 6px;
  padding: 12px 14px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: all 0.15s;
}
.eq-card:hover { border-color: var(--accent-border); background: var(--accent-light); transform: translateY(-1px); }
.eq-card .eq-name { font-size: 11px; font-weight: 500; color: var(--text-muted); }
.eq-card .eq-desc { font-size: 13px; color: var(--text-secondary); font-weight: 400; }
.eq-card .eq-meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); }

/* Model selector */
.model-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.model-card {
  padding: 14px 16px; background: var(--bg-inset); border: 2px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: all 0.15s;
}
.model-card:hover { border-color: var(--accent-border); background: var(--accent-light); }
.model-card.selected { border-color: var(--accent); background: var(--accent-light); }
.model-card .model-name { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.model-card .model-eq { margin-top: 6px; }
.model-card .model-eq .katex { font-size: 0.9em; }

/* Button */
.analyze-btn {
  width: 100%; padding: 15px; border: none; border-radius: var(--radius);
  font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600;
  cursor: pointer; background: var(--accent); color: #fff; margin-top: 12px; transition: all 0.15s;
}
.analyze-btn:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(180,74,45,0.2); }
.analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: none; transform: none; box-shadow: none; }

/* Results */
.result-banner { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-radius: var(--radius); margin-bottom: 16px; font-weight: 600; font-size: 15px; }
.result-banner.pass { background: var(--success-bg); border: 1px solid var(--success-border); color: var(--success); }
.result-banner.fail { background: var(--fail-bg); border: 1px solid var(--fail-border); color: var(--fail); }
.result-banner.warn { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn); }
.result-banner.info { background: var(--blue-bg); border: 1px solid var(--blue-border); color: var(--blue); }
.result-banner .icon { font-size: 20px; }

.breakdown-box { background: var(--bg-inset); border-radius: var(--radius); padding: 18px 20px; margin-top: 12px; border: 1px solid var(--border); }
.breakdown-box h4 { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 12px; }

.dim-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
.dim-label-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); min-width: 40px; font-weight: 600; }
.dim-value-tag { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--text); padding: 5px 14px; background: var(--bg-surface); border-radius: 6px; border: 1px solid var(--border); }

.detail-table { width: 100%; margin-top: 14px; border-collapse: collapse; }
.detail-table th { font-family: 'JetBrains Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
.detail-table td { font-size: 13px; padding: 10px; border-bottom: 1px solid rgba(0,0,0,0.04); color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; font-size: 12px; }
.detail-table td:first-child { color: var(--accent); font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 500; }

.info-hint {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); line-height: 1.7;
  margin-top: 10px; padding: 10px 14px; background: var(--bg-inset); border-radius: 6px; border-left: 3px solid var(--border);
}
.info-hint code { background: var(--bg-hover); padding: 1px 5px; border-radius: 3px; }

/* Chart */
.chart-container {
  position: relative;
  width: 100%;
  margin-top: 16px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.chart-container canvas { display: block; width: 100%; }

/* Residual plot */
.residual-strip {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.resid-bar {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.resid-bar-inner {
  width: 18px;
  border-radius: 3px;
  transition: height 0.3s ease;
}
.resid-bar-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  color: var(--text-muted);
}

/* Stat badge row */
.stat-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.stat-badge {
  flex: 1;
  min-width: 120px;
  padding: 12px 14px;
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-align: center;
}
.stat-badge .stat-val { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 700; color: var(--ink); }
.stat-badge .stat-lbl { font-family: 'JetBrains Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin-top: 4px; }

/* Prediction section */
.predict-row {
  display: flex; gap: 12px; align-items: center; margin-top: 14px;
}
.predict-input {
  flex: 1;
  background: var(--bg-surface);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  color: var(--ink);
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  padding: 12px 16px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.predict-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}
.predict-input::placeholder { color: var(--text-muted); }
.predict-btn {
  padding: 12px 24px; border: none; border-radius: var(--radius);
  font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600;
  cursor: pointer; background: var(--ink); color: #fff; transition: all 0.15s; white-space: nowrap;
}
.predict-btn:hover { filter: brightness(1.3); }
.predict-result {
  margin-top: 10px;
  padding: 12px 16px;
  background: var(--accent-light);
  border: 1px solid var(--accent-border);
  border-radius: var(--radius);
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--accent);
  text-align: center;
  display: none;
}

@keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.animate-in { animation: slideUp 0.3s ease; }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <h1>regression calculator</h1>
    <div class="subtitle">Fit curves to data with least-squares regression & visual diagnostics</div>
  </header>

  <!-- Data Input -->
  <div class="section">
    <div class="section-label">Data Input</div>
    <div class="toolbar" id="toolbar">
      <div class="toolbar-group">
        <button class="tb-btn active" data-tip="Comma separated" onclick="setDelim(',', this)">CSV</button>
        <button class="tb-btn" data-tip="Tab separated" onclick="setDelim('\t', this)">TSV</button>
        <button class="tb-btn" data-tip="Space separated" onclick="setDelim(' ', this)">Space</button>
      </div>
      <div class="toolbar-group">
        <button class="tb-btn" data-tip="Paste from clipboard" onclick="pasteClipboard()">&#x1f4cb; Paste</button>
        <button class="tb-btn" data-tip="Clear all data" onclick="clearData()">&#x2715; Clear</button>
      </div>
    </div>
    <textarea id="dataInput" class="data-input-area" placeholder="Enter x, y pairs — one per line&#10;&#10;Example:&#10;1, 2.1&#10;2, 3.9&#10;3, 6.2&#10;4, 7.8&#10;5, 10.1"></textarea>
    <div class="info-hint">
      Paste or type <code>x, y</code> pairs — one per line. Adjust the delimiter above if your data uses tabs or spaces.
    </div>
  </div>

  <!-- Sample Datasets -->
  <div class="section">
    <div class="section-label">Sample Datasets</div>
    <div class="eq-grid" id="sampleGrid"></div>
  </div>

  <!-- Model Selection -->
  <div class="section">
    <div class="section-label">Regression Model</div>
    <div class="model-grid" id="modelGrid"></div>
  </div>

  <!-- Run -->
  <div class="section">
    <button class="analyze-btn" onclick="runRegression()">Fit Regression</button>
  </div>

  <!-- Results -->
  <div class="section" id="resultSection" style="display:none">
    <div class="section-label">Result</div>
    <div id="resultContent"></div>
  </div>

  <!-- Chart -->
  <div class="section" id="chartSection" style="display:none">
    <div class="section-label">Scatter &amp; Fit</div>
    <div class="chart-container">
      <canvas id="chart"></canvas>
    </div>
  </div>

  <!-- Residuals -->
  <div class="section" id="residSection" style="display:none">
    <div class="section-label">Residuals</div>
    <div class="chart-container">
      <canvas id="residChart"></canvas>
    </div>
  </div>

  <!-- Predict -->
  <div class="section" id="predictSection" style="display:none">
    <div class="section-label">Predict</div>
    <div class="predict-row">
      <input type="number" id="predictInput" class="predict-input" placeholder="Enter x value" step="any">
      <button class="predict-btn" onclick="predict()">Predict y</button>
    </div>
    <div id="predictResult" class="predict-result"></div>
  </div>
</div>

<script>
// State
let delim = ',';
let selectedModel = 'linear';
let lastFit = null;

// Delimiter
function setDelim(d, btn) {
  delim = d;
  document.querySelectorAll('.toolbar-group:first-child .tb-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
function pasteClipboard() {
  navigator.clipboard.readText().then(t => { document.getElementById('dataInput').value = t; }).catch(() => {});
}
function clearData() {
  document.getElementById('dataInput').value = '';
  ['resultSection','chartSection','residSection','predictSection'].forEach(id => document.getElementById(id).style.display = 'none');
}

// Sample datasets
const samples = [
  { name: "Linear Growth", desc: "Sales over months", meta: "12 points · linear", data: "1,2.1\n2,4.0\n3,5.8\n4,8.1\n5,9.9\n6,12.0\n7,14.2\n8,15.9\n9,18.1\n10,20.0\n11,22.1\n12,23.9" },
  { name: "Quadratic Motion", desc: "Free-fall distance (m)", meta: "8 points · quadratic", data: "0,0\n1,4.9\n2,19.6\n3,44.1\n4,78.5\n5,122.6\n6,176.6\n7,240.3" },
  { name: "Exponential Decay", desc: "Radioactive counts", meta: "10 points · exponential", data: "0,1000\n1,607\n2,368\n3,223\n4,135\n5,82\n6,50\n7,30\n8,18\n9,11" },
  { name: "Log Diminishing", desc: "Marginal utility", meta: "9 points · logarithmic", data: "1,0\n2,1.4\n3,2.2\n4,2.8\n5,3.2\n6,3.6\n7,3.9\n8,4.2\n9,4.4" },
  { name: "Power Law", desc: "Metabolic rate vs mass", meta: "8 points · power", data: "1,3.5\n2,9.9\n5,33.1\n10,93.3\n20,263\n50,916\n100,2580\n200,7280" },
  { name: "Noisy Linear", desc: "Exam score vs hours", meta: "15 points · scattered", data: "1,42\n2,48\n3,51\n3.5,54\n4,50\n5,62\n5.5,58\n6,65\n7,72\n7.5,68\n8,74\n9,80\n10,78\n10.5,85\n11,82" },
  { name: "Sinusoidal", desc: "Temperature over hours", meta: "12 points · periodic", data: "0,20\n1,22.4\n2,23.7\n3,23.5\n4,21.8\n5,19.5\n6,17.3\n7,16.2\n8,16.5\n9,18.2\n10,20.5\n11,22.6" },
];

function buildSamples() {
  const grid = document.getElementById('sampleGrid');
  for (const s of samples) {
    const card = document.createElement('div'); card.className = 'eq-card';
    card.innerHTML = `<span class="eq-name">${s.name}</span><span class="eq-desc">${s.desc}</span><span class="eq-meta">${s.meta}</span>`;
    card.onclick = () => { document.getElementById('dataInput').value = s.data; delim = ','; document.querySelectorAll('.toolbar-group:first-child .tb-btn').forEach(b=>b.classList.remove('active')); document.querySelector('.toolbar-group:first-child .tb-btn').classList.add('active'); };
    grid.appendChild(card);
  }
}

// Models
const models = [
  { id: 'linear', name: 'Linear', tex: 'y = ax + b' },
  { id: 'quadratic', name: 'Quadratic', tex: 'y = ax^2 + bx + c' },
  { id: 'cubic', name: 'Cubic', tex: 'y = ax^3 + bx^2 + cx + d' },
  { id: 'exponential', name: 'Exponential', tex: 'y = a \\cdot e^{bx}' },
  { id: 'logarithmic', name: 'Logarithmic', tex: 'y = a \\ln(x) + b' },
  { id: 'power', name: 'Power', tex: 'y = a \\cdot x^b' },
  { id: 'sinusoidal', name: 'Sinusoidal', tex: 'y = a \\sin(bx + c) + d' },
];

function buildModels() {
  const grid = document.getElementById('modelGrid');
  for (const m of models) {
    const card = document.createElement('div');
    card.className = 'model-card' + (m.id === selectedModel ? ' selected' : '');
    card.id = 'mc-' + m.id;
    const eq = document.createElement('div'); eq.className = 'model-eq';
    try { katex.render(m.tex, eq, { throwOnError: false }); } catch { eq.textContent = m.tex; }
    card.innerHTML = `<div class="model-name">${m.name}</div>`;
    card.appendChild(eq);
    card.onclick = () => {
      selectedModel = m.id;
      document.querySelectorAll('.model-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
    };
    grid.appendChild(card);
  }
}

// Parse data
function parseData() {
  const raw = document.getElementById('dataInput').value.trim();
  if (!raw) return null;
  const lines = raw.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
  const pts = [];
  for (const line of lines) {
    let parts;
    if (delim === '\t') parts = line.split('\t');
    else if (delim === ' ') parts = line.split(/\s+/);
    else parts = line.split(',');
    if (parts.length < 2) continue;
    const x = parseFloat(parts[0]), y = parseFloat(parts[1]);
    if (!isNaN(x) && !isNaN(y)) pts.push({ x, y });
  }
  return pts.length >= 2 ? pts : null;
}

// Least squares helpers
function polyFit(pts, degree) {
  const n = pts.length;
  const size = degree + 1;
  // Build normal equations
  const M = Array.from({ length: size }, () => new Array(size + 1).fill(0));
  for (let i = 0; i < size; i++) {
    for (let j = 0; j < size; j++) {
      let s = 0; for (const p of pts) s += Math.pow(p.x, i + j); M[i][j] = s;
    }
    let s = 0; for (const p of pts) s += p.y * Math.pow(p.x, i); M[i][size] = s;
  }
  // Gauss elimination
  for (let col = 0; col < size; col++) {
    let maxR = col;
    for (let r = col + 1; r < size; r++) if (Math.abs(M[r][col]) > Math.abs(M[maxR][col])) maxR = r;
    [M[col], M[maxR]] = [M[maxR], M[col]];
    if (Math.abs(M[col][col]) < 1e-15) continue;
    for (let r = col + 1; r < size; r++) {
      const f = M[r][col] / M[col][col];
      for (let c = col; c <= size; c++) M[r][c] -= f * M[col][c];
    }
  }
  const coeffs = new Array(size).fill(0);
  for (let i = size - 1; i >= 0; i--) {
    let s = M[i][size];
    for (let j = i + 1; j < size; j++) s -= M[i][j] * coeffs[j];
    coeffs[i] = s / M[i][i];
  }
  return coeffs; // [c0, c1, c2, ...] → y = c0 + c1*x + c2*x² + ...
}

function fitModel(pts, model) {
  switch (model) {
    case 'linear': {
      const c = polyFit(pts, 1);
      return { coeffs: c, predict: x => c[0] + c[1] * x, label: 'linear' };
    }
    case 'quadratic': {
      const c = polyFit(pts, 2);
      return { coeffs: c, predict: x => c[0] + c[1] * x + c[2] * x * x, label: 'quadratic' };
    }
    case 'cubic': {
      const c = polyFit(pts, 3);
      return { coeffs: c, predict: x => c[0] + c[1] * x + c[2] * x * x + c[3] * x * x * x, label: 'cubic' };
    }
    case 'exponential': {
      // ln(y) = ln(a) + bx — filter y > 0
      const valid = pts.filter(p => p.y > 0);
      if (valid.length < 2) return null;
      const logPts = valid.map(p => ({ x: p.x, y: Math.log(p.y) }));
      const c = polyFit(logPts, 1);
      const a = Math.exp(c[0]), b = c[1];
      return { coeffs: [a, b], predict: x => a * Math.exp(b * x), label: 'exponential' };
    }
    case 'logarithmic': {
      const valid = pts.filter(p => p.x > 0);
      if (valid.length < 2) return null;
      const logPts = valid.map(p => ({ x: Math.log(p.x), y: p.y }));
      const c = polyFit(logPts, 1);
      return { coeffs: [c[1], c[0]], predict: x => c[1] * Math.log(x) + c[0], label: 'logarithmic' };
    }
    case 'power': {
      const valid = pts.filter(p => p.x > 0 && p.y > 0);
      if (valid.length < 2) return null;
      const logPts = valid.map(p => ({ x: Math.log(p.x), y: Math.log(p.y) }));
      const c = polyFit(logPts, 1);
      const a = Math.exp(c[0]), b = c[1];
      return { coeffs: [a, b], predict: x => a * Math.pow(x, b), label: 'power' };
    }
    case 'sinusoidal': {
      // y = a*sin(b*x + c) + d — grid search over b, then solve a,c,d
      if (pts.length < 4) return null;
      const n = pts.length;
      const yMean = pts.reduce((s, p) => s + p.y, 0) / n;
      const xs = pts.map(p => p.x);
      const xRange = Math.max(...xs) - Math.min(...xs);
      let bestSSR = Infinity, bestParams = null;
      // Search frequencies: try many candidate b values
      for (let fi = 1; fi <= 200; fi++) {
        const b = (fi * Math.PI) / (xRange || 1);
        // For fixed b, y = a*sin(bx+c) + d = a*cos(c)*sin(bx) + a*sin(c)*cos(bx) + d
        // Let A = a*cos(c), B = a*sin(c), D = d → linear: y = A*sin(bx) + B*cos(bx) + D
        const M = Array.from({ length: 3 }, () => new Array(4).fill(0));
        // Normal equations for [A, B, D]
        let ss = 0, sc = 0, s1 = 0, cc = 0, c1 = 0, sy = 0, cy = 0, y1 = 0;
        for (const p of pts) {
          const sv = Math.sin(b * p.x), cv = Math.cos(b * p.x);
          ss += sv * sv; sc += sv * cv; s1 += sv;
          cc += cv * cv; c1 += cv;
          sy += sv * p.y; cy += cv * p.y; y1 += p.y;
        }
        M[0][0] = ss; M[0][1] = sc; M[0][2] = s1; M[0][3] = sy;
        M[1][0] = sc; M[1][1] = cc; M[1][2] = c1; M[1][3] = cy;
        M[2][0] = s1; M[2][1] = c1; M[2][2] = n;  M[2][3] = y1;
        // Solve 3x3
        for (let col = 0; col < 3; col++) {
          let maxR = col;
          for (let r = col + 1; r < 3; r++) if (Math.abs(M[r][col]) > Math.abs(M[maxR][col])) maxR = r;
          [M[col], M[maxR]] = [M[maxR], M[col]];
          if (Math.abs(M[col][col]) < 1e-15) continue;
          for (let r = col + 1; r < 3; r++) {
            const f = M[r][col] / M[col][col];
            for (let j = col; j < 4; j++) M[r][j] -= f * M[col][j];
          }
        }
        const sol = [0, 0, 0];
        for (let i = 2; i >= 0; i--) {
          let s = M[i][3];
          for (let j = i + 1; j < 3; j++) s -= M[i][j] * sol[j];
          sol[i] = M[i][i] !== 0 ? s / M[i][i] : 0;
        }
        const A = sol[0], B = sol[1], D = sol[2];
        const a = Math.sqrt(A * A + B * B);
        const c = Math.atan2(B, A);
        // Compute SSR
        let ssr = 0;
        for (const p of pts) { const r = p.y - (a * Math.sin(b * p.x + c) + D); ssr += r * r; }
        if (ssr < bestSSR) { bestSSR = ssr; bestParams = [a, b, c, D]; }
      }
      if (!bestParams) return null;
      const [a, b, c, d] = bestParams;
      return { coeffs: bestParams, predict: x => a * Math.sin(b * x + c) + d, label: 'sinusoidal' };
    }
  }
}

function computeStats(pts, fit) {
  const n = pts.length;
  const yMean = pts.reduce((s, p) => s + p.y, 0) / n;
  let ssTot = 0, ssRes = 0;
  const residuals = [];
  for (const p of pts) {
    const yHat = fit.predict(p.x);
    const r = p.y - yHat;
    residuals.push({ x: p.x, r });
    ssRes += r * r;
    ssTot += (p.y - yMean) * (p.y - yMean);
  }
  const r2 = ssTot === 0 ? 1 : 1 - ssRes / ssTot;
  const rmse = Math.sqrt(ssRes / n);
  const mae = residuals.reduce((s, r) => s + Math.abs(r.r), 0) / n;
  return { r2, rmse, mae, residuals, ssRes, ssTot };
}

function formatCoeff(v) {
  if (Math.abs(v) < 0.0001 && v !== 0) return v.toExponential(4);
  return parseFloat(v.toPrecision(6)).toString();
}

function getEquationTex(model, coeffs) {
  switch (model) {
    case 'linear': return `y = ${formatCoeff(coeffs[1])}x ${coeffs[0] >= 0 ? '+' : '-'} ${formatCoeff(Math.abs(coeffs[0]))}`;
    case 'quadratic': {
      let s = `y = ${formatCoeff(coeffs[2])}x^2`;
      s += ` ${coeffs[1] >= 0 ? '+' : '-'} ${formatCoeff(Math.abs(coeffs[1]))}x`;
      s += ` ${coeffs[0] >= 0 ? '+' : '-'} ${formatCoeff(Math.abs(coeffs[0]))}`;
      return s;
    }
    case 'cubic': {
      let s = `y = ${formatCoeff(coeffs[3])}x^3`;
      s += ` ${coeffs[2] >= 0 ? '+' : '-'} ${formatCoeff(Math.abs(coeffs[2]))}x^2`;
      s += ` ${coeffs[1] >= 0 ? '+' : '-'} ${formatCoeff(Math.abs(coeffs[1]))}x`;
      s += ` ${coeffs[0] >= 0 ? '+' : '-'} ${formatCoeff(Math.abs(coeffs[0]))}`;
      return s;
    }
    case 'exponential': return `y = ${formatCoeff(coeffs[0])} \\cdot e^{${formatCoeff(coeffs[1])}x}`;
    case 'logarithmic': return `y = ${formatCoeff(coeffs[0])} \\ln(x) ${coeffs[1] >= 0 ? '+' : '-'} ${formatCoeff(Math.abs(coeffs[1]))}`;
    case 'power': return `y = ${formatCoeff(coeffs[0])} \\cdot x^{${formatCoeff(coeffs[1])}}`;
    case 'sinusoidal': return `y = ${formatCoeff(coeffs[0])} \\sin(${formatCoeff(coeffs[1])}x ${coeffs[2] >= 0 ? '+' : '-'} ${formatCoeff(Math.abs(coeffs[2]))}) ${coeffs[3] >= 0 ? '+' : '-'} ${formatCoeff(Math.abs(coeffs[3]))}`;
  }
}

// Chart drawing
function drawChart(pts, fit) {
  const section = document.getElementById('chartSection');
  section.style.display = '';
  const canvas = document.getElementById('chart');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.parentElement.clientWidth;
  const H = Math.min(400, W * 0.55);
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const pad = { top: 24, right: 28, bottom: 44, left: 56 };
  const cw = W - pad.left - pad.right;
  const ch = H - pad.top - pad.bottom;

  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  let xMin = Math.min(...xs), xMax = Math.max(...xs);
  let yMin = Math.min(...ys), yMax = Math.max(...ys);
  // Add some curve points to bounds
  const steps = 200;
  const dx = (xMax - xMin) || 1;
  for (let i = 0; i <= steps; i++) {
    const xv = xMin - dx * 0.05 + (dx * 1.1) * i / steps;
    try { const yv = fit.predict(xv); if (isFinite(yv)) { yMin = Math.min(yMin, yv); yMax = Math.max(yMax, yv); } } catch {}
  }
  const xPad = (xMax - xMin) * 0.08 || 0.5;
  const yPad = (yMax - yMin) * 0.08 || 0.5;
  xMin -= xPad; xMax += xPad; yMin -= yPad; yMax += yPad;

  const toX = v => pad.left + (v - xMin) / (xMax - xMin) * cw;
  const toY = v => pad.top + ch - (v - yMin) / (yMax - yMin) * ch;

  // Background
  ctx.fillStyle = '#faf8f5';
  ctx.fillRect(0, 0, W, H);

  // Grid
  ctx.strokeStyle = 'rgba(180,160,140,0.15)';
  ctx.lineWidth = 1;
  const xTicks = niceAxis(xMin, xMax, 8);
  const yTicks = niceAxis(yMin, yMax, 6);
  for (const v of xTicks) { ctx.beginPath(); ctx.moveTo(toX(v), pad.top); ctx.lineTo(toX(v), pad.top + ch); ctx.stroke(); }
  for (const v of yTicks) { ctx.beginPath(); ctx.moveTo(pad.left, toY(v)); ctx.lineTo(pad.left + cw, toY(v)); ctx.stroke(); }

  // Axes
  ctx.strokeStyle = '#c5bfb5';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(pad.left, pad.top + ch); ctx.lineTo(pad.left + cw, pad.top + ch); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pad.left, pad.top); ctx.lineTo(pad.left, pad.top + ch); ctx.stroke();

  // Tick labels
  ctx.fillStyle = '#9a9489';
  ctx.font = '10px "JetBrains Mono", monospace';
  ctx.textAlign = 'center';
  for (const v of xTicks) { ctx.fillText(formatAxis(v), toX(v), pad.top + ch + 18); }
  ctx.textAlign = 'right';
  for (const v of yTicks) { ctx.fillText(formatAxis(v), pad.left - 8, toY(v) + 3.5); }

  // Curve
  ctx.strokeStyle = '#b44a2d';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  let started = false;
  for (let i = 0; i <= steps; i++) {
    const xv = xMin + (xMax - xMin) * i / steps;
    try {
      const yv = fit.predict(xv);
      if (!isFinite(yv)) { started = false; continue; }
      const px = toX(xv), py = toY(yv);
      if (py < pad.top - 20 || py > pad.top + ch + 20) { started = false; continue; }
      if (!started) { ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py);
    } catch { started = false; }
  }
  ctx.stroke();

  // Points
  for (const p of pts) {
    ctx.beginPath();
    ctx.arc(toX(p.x), toY(p.y), 5, 0, Math.PI * 2);
    ctx.fillStyle = '#2c2824';
    ctx.fill();
    ctx.strokeStyle = '#faf8f5';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Axis labels
  ctx.fillStyle = '#5c574e';
  ctx.font = '12px "Outfit", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('x', pad.left + cw / 2, H - 6);
  ctx.save();
  ctx.translate(14, pad.top + ch / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText('y', 0, 0);
  ctx.restore();
}

function drawResiduals(residuals) {
  const section = document.getElementById('residSection');
  section.style.display = '';
  const canvas = document.getElementById('residChart');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.parentElement.clientWidth;
  const H = 200;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const pad = { top: 20, right: 28, bottom: 36, left: 56 };
  const cw = W - pad.left - pad.right;
  const ch = H - pad.top - pad.bottom;

  const xs = residuals.map(r => r.x);
  const rs = residuals.map(r => r.r);
  let xMin = Math.min(...xs), xMax = Math.max(...xs);
  let rMax = Math.max(...rs.map(Math.abs)) || 1;
  const xPad = (xMax - xMin) * 0.08 || 0.5;
  xMin -= xPad; xMax += xPad; rMax *= 1.15;

  const toX = v => pad.left + (v - xMin) / (xMax - xMin) * cw;
  const toY = v => pad.top + ch / 2 - (v / rMax) * (ch / 2);

  ctx.fillStyle = '#faf8f5';
  ctx.fillRect(0, 0, W, H);

  // Zero line
  ctx.strokeStyle = '#c5bfb5';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(pad.left, toY(0)); ctx.lineTo(pad.left + cw, toY(0)); ctx.stroke();
  ctx.setLineDash([]);

  // Grid
  ctx.strokeStyle = 'rgba(180,160,140,0.12)';
  const xTicks = niceAxis(xMin, xMax, 8);
  for (const v of xTicks) { ctx.beginPath(); ctx.moveTo(toX(v), pad.top); ctx.lineTo(toX(v), pad.top + ch); ctx.stroke(); }

  // Tick labels
  ctx.fillStyle = '#9a9489';
  ctx.font = '10px "JetBrains Mono", monospace';
  ctx.textAlign = 'center';
  for (const v of xTicks) ctx.fillText(formatAxis(v), toX(v), pad.top + ch + 16);

  // Stems and dots
  for (const r of residuals) {
    const px = toX(r.x), py = toY(r.r), py0 = toY(0);
    ctx.strokeStyle = r.r >= 0 ? 'rgba(45,122,79,0.4)' : 'rgba(168,50,50,0.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(px, py0); ctx.lineTo(px, py); ctx.stroke();
    ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2);
    ctx.fillStyle = r.r >= 0 ? '#2d7a4f' : '#a83232';
    ctx.fill();
  }

  ctx.fillStyle = '#5c574e';
  ctx.font = '12px "Outfit", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('x', pad.left + cw / 2, H - 4);
  ctx.save();
  ctx.translate(14, pad.top + ch / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText('residual', 0, 0);
  ctx.restore();
}

function niceAxis(lo, hi, maxTicks) {
  const range = hi - lo || 1;
  const rough = range / maxTicks;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const res = rough / mag;
  let step;
  if (res <= 1.5) step = mag;
  else if (res <= 3) step = 2 * mag;
  else if (res <= 7) step = 5 * mag;
  else step = 10 * mag;
  const start = Math.ceil(lo / step) * step;
  const ticks = [];
  for (let v = start; v <= hi + step * 0.01; v += step) ticks.push(v);
  return ticks;
}

function formatAxis(v) {
  if (Math.abs(v) >= 10000 || (Math.abs(v) < 0.01 && v !== 0)) return v.toExponential(1);
  return parseFloat(v.toPrecision(4)).toString();
}

// Main
function runRegression() {
  const pts = parseData();
  const rc = document.getElementById('resultContent');
  const rs = document.getElementById('resultSection');
  rs.style.display = '';

  if (!pts) {
    rc.innerHTML = '<div class="result-banner warn"><span class="icon">&#x26A0;</span> Need at least 2 valid data points</div>';
    ['chartSection','residSection','predictSection'].forEach(id => document.getElementById(id).style.display = 'none');
    return;
  }

  const fit = fitModel(pts, selectedModel);
  if (!fit) {
    rc.innerHTML = '<div class="result-banner fail"><span class="icon">&#x2717;</span> Model requires positive values (check data)</div>';
    ['chartSection','residSection','predictSection'].forEach(id => document.getElementById(id).style.display = 'none');
    return;
  }

  lastFit = fit;
  const stats = computeStats(pts, fit);
  const eqTex = getEquationTex(selectedModel, fit.coeffs);

  const r2Class = stats.r2 >= 0.95 ? 'pass' : stats.r2 >= 0.8 ? 'info' : stats.r2 >= 0.5 ? 'warn' : 'fail';
  const r2Icon = stats.r2 >= 0.8 ? '&#x2713;' : stats.r2 >= 0.5 ? '&#x26A0;' : '&#x2717;';
  const r2Desc = stats.r2 >= 0.95 ? 'Excellent Fit' : stats.r2 >= 0.8 ? 'Good Fit' : stats.r2 >= 0.5 ? 'Moderate Fit' : 'Poor Fit';

  let h = `<div class="result-banner ${r2Class}"><span class="icon">${r2Icon}</span> ${r2Desc}</div>`;

  h += `<div class="breakdown-box"><h4>Fitted Equation</h4><div style="text-align:center;padding:8px 0"><span id="eqRender"></span></div></div>`;

  h += `<div class="stat-row">
    <div class="stat-badge"><div class="stat-val">${stats.r2.toFixed(4)}</div><div class="stat-lbl">R²</div></div>
    <div class="stat-badge"><div class="stat-val">${stats.rmse.toPrecision(4)}</div><div class="stat-lbl">RMSE</div></div>
    <div class="stat-badge"><div class="stat-val">${stats.mae.toPrecision(4)}</div><div class="stat-lbl">MAE</div></div>
    <div class="stat-badge"><div class="stat-val">${pts.length}</div><div class="stat-lbl">Points</div></div>
  </div>`;

  // Coefficients table
  h += `<div class="breakdown-box" style="margin-top:12px"><h4>Coefficients</h4><table class="detail-table"><thead><tr><th>Parameter</th><th>Value</th></tr></thead><tbody>`;
  const paramNames = { linear: ['b (intercept)', 'a (slope)'], quadratic: ['c (intercept)', 'b', 'a'], cubic: ['d (intercept)', 'c', 'b', 'a'], exponential: ['a (amplitude)', 'b (rate)'], logarithmic: ['a (scale)', 'b (offset)'], power: ['a (coefficient)', 'b (exponent)'], sinusoidal: ['a (amplitude)', 'b (frequency)', 'c (phase)', 'd (offset)'] };
  const names = paramNames[selectedModel] || [];
  for (let i = 0; i < fit.coeffs.length; i++) {
    h += `<tr><td>${names[i] || 'c' + i}</td><td>${formatCoeff(fit.coeffs[i])}</td></tr>`;
  }
  h += `</tbody></table></div>`;

  // Data table
  h += `<div class="breakdown-box" style="margin-top:12px"><h4>Data &amp; Fitted Values</h4><table class="detail-table"><thead><tr><th>x</th><th>y (observed)</th><th>ŷ (fitted)</th><th>Residual</th></tr></thead><tbody>`;
  for (let i = 0; i < pts.length; i++) {
    const yHat = fit.predict(pts[i].x);
    const r = pts[i].y - yHat;
    h += `<tr><td>${formatCoeff(pts[i].x)}</td><td>${formatCoeff(pts[i].y)}</td><td>${formatCoeff(yHat)}</td><td style="color:${r >= 0 ? 'var(--success)' : 'var(--fail)'}">${r >= 0 ? '+' : ''}${formatCoeff(r)}</td></tr>`;
  }
  h += `</tbody></table></div>`;

  rc.innerHTML = h;
  rs.classList.add('animate-in');

  try { katex.render(eqTex, document.getElementById('eqRender'), { throwOnError: false, displayMode: true }); } catch {}

  drawChart(pts, fit);
  drawResiduals(stats.residuals);

  document.getElementById('predictSection').style.display = '';
  document.getElementById('predictResult').style.display = 'none';
}

function predict() {
  if (!lastFit) return;
  const x = parseFloat(document.getElementById('predictInput').value);
  if (isNaN(x)) return;
  try {
    const y = lastFit.predict(x);
    const el = document.getElementById('predictResult');
    el.style.display = '';
    el.innerHTML = `ŷ = ${formatCoeff(y)}`;
  } catch {}
}

// Boot
buildSamples();
buildModels();
</script>
</body>
